name: 'Kisonar JEE CI'

on: [ push ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: GitHub checkout action
        uses: actions/checkout@v7

      - name: Setup Java 27
        uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '27'
      - name: Print Java version
        run: java --version

      - name: Print Maven version
        run: mvn --version

      - name: Run Maven compilation, unit testing & packaging
        run: mvn clean install